<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoachFit Pro</title>
<meta name="description" content="Entrenamientos y dietas a medida para cada cliente.">
<meta name="theme-color" content="#d63f7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CoachFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--surface2:#f0f2f5;--text:#1b1f24;--muted:#5f6873;--line:#e0e3e8;
--ok:#1f8a4c;--warn:#b7791f;--bad:#c53030;--info:#2b6cb0;
--h:#2563eb;--h-soft:#e7eefc;--m:#d63f7a;--m-soft:#fbe8f0;--accent:#475569;--accent-soft:#eef1f5;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--surface:#171b21;--surface2:#1f242b;--text:#e7eaee;--muted:#9aa4af;--line:#2b313a;
--ok:#48bb78;--warn:#ecc94b;--bad:#fc8181;--info:#63b3ed;--h:#5b8cff;--h-soft:#17243f;--m:#f06b9f;--m-soft:#3a1828;--accent-soft:#1f242b}}
body[data-sexo=H]{--accent:var(--h);--accent-soft:var(--h-soft)}
body[data-sexo=M]{--accent:var(--m);--accent-soft:var(--m-soft)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--m),var(--h));display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:12px}
.newbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn-sex{border:0;border-radius:10px;padding:10px 6px;font-weight:600;font-size:13px;color:#fff}
.btn-sex.M{background:var(--m)}.btn-sex.H{background:var(--h)}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.filters{display:flex;gap:4px;margin:10px 0 4px}
.filters button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px;font-size:12.5px}
.filters button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 6px;font-weight:600}
.cl{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px}
.cl:hover{background:var(--surface2)}.cl.on{background:var(--surface2);border-color:var(--line)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.av.M{background:var(--m)}.av.H{background:var(--h)}
.cl small{display:block;color:var(--muted);font-size:12px}
.side-foot{margin-top:18px;display:grid;gap:6px}
main{padding:22px 28px 70px;max-width:1150px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:23px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:16.5px;margin:0 0 3px}
.card h3{font-size:14px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface2);overflow:hidden}
.inp input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px;outline:none}
.inp em{font-style:normal;color:var(--muted);font-size:12.5px;padding-right:10px}
.fld select,.fld textarea,.fld input.txt{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:8px 10px}
.fld textarea{min-height:70px;resize:vertical}
.inp:focus-within,.fld select:focus,.fld textarea:focus,.fld input.txt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:500;font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:650}
.sexseg button.on[data-v=M]{background:var(--m);color:#fff}.sexseg button.on[data-v=H]{background:var(--h);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.x.on{background:var(--bad);border-color:var(--bad);color:#fff;text-decoration:line-through}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.goal{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.goal b{display:block;margin-bottom:3px}.goal small{color:var(--muted);font-size:12.5px}
.goal.on{border-color:var(--accent);background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:20px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}.stat .d{font-size:12px;color:var(--muted)}
.stat.ok{border-left-color:var(--ok)}.stat.warn{border-left-color:var(--warn)}.stat.bad{border-left-color:var(--bad)}.stat.info{border-left-color:var(--info)}
.note{padding:9px 12px;border-radius:9px;background:var(--surface2);border-left:3px solid var(--info);font-size:13.5px;margin:6px 0}
.note.warn{border-left-color:var(--warn)}.note.bad{border-left-color:var(--bad)}.note.ok{border-left-color:var(--ok)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13.5px}
.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 14px;font-size:13.5px}
.exrow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exn{flex:1;min-width:0}.exn b{display:block}.exn small{color:var(--muted);font-size:12.5px;display:block}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.dose{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
.pill b{font-weight:700}
.swap{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;font-size:12px;padding:2px 8px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.meal{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meal-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.meal-h b{font-size:15px}.meal-h span{color:var(--muted);font-size:12.5px}
.food{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px;border-top:1px dashed var(--line)}
.food span:last-child{color:var(--muted);font-size:12.5px;white-space:nowrap}
.bars{display:grid;gap:8px}
.barl{display:flex;justify-content:space-between;font-size:13px}
.bar{height:7px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.chart{border:1px solid var(--line);border-radius:10px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:12px;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.empty{text-align:center;padding:60px 20px}
.empty .newbtns{max-width:420px;margin:20px auto}
.empty .btn-sex{padding:16px;font-size:15px}
details.exgrp{border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:6px}
details.exgrp summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:3px 0}
details.exgrp .chips{margin:8px 0 4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.muted{color:var(--muted)}
.disclaimer{font-size:12.5px;color:var(--muted);margin-top:8px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
.cllist{max-height:230px;overflow:auto}main{padding:16px}.cols2{grid-template-columns:1fr}.exrow{flex-wrap:wrap}.dose{justify-content:flex-start;max-width:none;width:100%;padding-left:38px}}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:10px;background:#fff}
.logo.has{background:none}
.printhead,.printfoot{display:none}
.brandprev{display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:12px}
.brandprev .bl{width:64px;height:64px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:12px;text-align:center}
.brandprev .bl img{width:100%;height:100%;object-fit:contain}
.install{background:linear-gradient(135deg,var(--m),var(--h));color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:8px 10px}
@media print{aside,.tabs,.noprint{display:none!important}.app{display:block}main{padding:0;max-width:none}
.card{break-inside:avoid;border-color:#bbb}body{background:#fff;color:#000}
.printhead{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
.printhead img{max-height:60px;max-width:160px;object-fit:contain}
.printhead .pt b{font-size:17px;display:block}.printhead .pt,.printhead .pc{font-size:12px;color:#444}.printhead .pc{text-align:right}
.printfoot{display:block;font-size:11px;color:#555;border-top:1px solid #ccc;padding-top:8px;margin-top:10px}}
</style>
</head>

const OBJETIVOS=[
 ['perder_grasa','Perder grasa','Bajar grasa y peso conservando el músculo.'],

X('press_banca','Press de banca con barra','Pecho',['barra','banco'],['hombro','muneca'],'UAC',2,'Escápulas juntas y pies firmes; baja controlado hasta el pecho.');

X('jalon','Jalón al pecho en polea','Espalda',['polea'],['hombro'],'SC',1,'Lleva la barra a la parte alta del pecho, pecho arriba.');
X('jalon_banda','Jalón con banda elástica','Espalda',['bandas'],[],'S',1,'Banda anclada arriba; lleva los codos a las costillas.');

X('remo_mancuerna','Remo a una mano con mancuerna','Espalda',['mancuernas','banco'],[],'C',1,'Apoya mano y rodilla en el banco; codo pegado.');

X('remo_trx','Remo invertido en TRX','Espalda',['trx'],[],'C',1,'Cuanto más inclinado el cuerpo, más difícil.');
X('remo_banda','Remo sentado con banda elástica','Espalda',['bandas'],[],'S',1,'Tira hacia el abdomen con la espalda recta.');
X('face_pull','Face pull en polea','Hombro posterior',['polea'],[],'S',1,'Cuerda a la altura de la cara; abre codos y rota hacia fuera.');
X('press_militar','Press militar con barra de pie','Hombro',['barra'],['hombro','lumbar'],'ACB',2,'Glúteos y abdomen firmes; no arquees la zona lumbar.');
X('press_hombro_manc','Press de hombros sentado con mancuernas','Hombro',['mancuernas','banco'],['hombro'],'SC',1,'Respaldo casi vertical; no bloquees codos arriba.');

function metrics(c){
 const peso=+c.peso||0,alt=+c.altura||0,edad=+c.edad||0,H=c.sexo==='H',hm=alt/100;
 const imc=hm?peso/(hm*hm):0;
 let grasa=parseFloat(c.grasa),est=false;
 if(!(grasa>0)){grasa=Math.max(5,Math.min(55,1.2*imc+0.23*edad-10.8*(H?1:0)-5.4));est=true}
 const lbm=peso*(1-grasa/100);
 const ffmi=hm?lbm/(hm*hm)+6.1*(1.8-hm):0;
 return{peso,alt,edad,H,imc,grasa,est,lbm,ffmi,agua:parseFloat(c.agua),musculo:parseFloat(c.musculo),visceral:parseFloat(c.visceral),cintura:parseFloat(c.cintura)};
}

 out.push({l:'IMC',v:fmt(m.imc,1),s:imcS[0],d:imcS[1]+' · orientativo, no distingue músculo de grasa'});
 const gs=m.grasa<fr[0]?['warn','Por debajo de lo saludable']:m.grasa<fr[1]?['ok','Saludable']:m.grasa<fr[2]?['warn','Elevado']:['bad','Muy elevado'];
 out.push({l:'% grasa'+(m.est?' (estimado)':''),v:fmt(m.grasa,1)+' %',s:m.est?'info':gs[0],d:gs[1]+` · rango sano ${fr[0]}-${fr[1]-1}%`});
 out.push({l:'Masa libre de grasa',v:fmt(m.lbm,1)+' kg',s:'info',d:'Músculo, huesos, órganos y agua'});
 const fl=m.H?[17,20,22]:[14,17,19];
 const fs=m.ffmi<fl[0]?['warn','Masa muscular baja']:m.ffmi<fl[1]?['ok','Normal']:m.ffmi<fl[2]?['ok','Muy buena (atlética)']:['info','Muy alta'];
 out.push({l:'Índice de masa magra (FFMI)',v:fmt(m.ffmi,1),s:fs[0],d:fs[1]});
 if(m.musculo>0)out.push({l:'Masa muscular',v:fmt(m.musculo,1)+' kg',s:'info',d:fmt(m.musculo/m.peso*100,1)+'% del peso · compárala siempre con la misma báscula'});
 if(m.agua>0){const lo=m.H?50:45,hi=m.H?65:60;const s=m.agua<lo?['warn','Baja: posible deshidratación o exceso de grasa']:m.agua>hi?['info','Alta']:['ok','Normal'];out.push({l:'Agua corporal',v:fmt(m.agua,1)+' %',s:s[0],d:s[1]+` · rango ${lo}-${hi}%`})}
 if(m.visceral>0){const s=m.visceral<=9?['ok','Saludable']:m.visceral<=12?['warn','En el límite']:['bad','Elevada: riesgo metabólico'];out.push({l:'Grasa visceral',v:fmt(m.visceral,0),s:s[0],d:s[1]})}
 if(m.cintura>0&&m.alt){const ica=m.cintura/m.alt;const s=ica<0.5?['ok','Sin riesgo']:ica<0.6?['warn','Riesgo aumentado']:['bad','Riesgo alto'];out.push({l:'Cintura / altura',v:fmt(ica,2),s:s[0],d:s[1]+' · ideal < 0,50'})}
 return out;
}

 if(d==='vegana'&&['carne','pescado','marisco','huevo','lacteo'].some(x=>t.has(x)))return false;

const pickR=(arr,rng)=>arr[Math.floor(rng()*arr.length)];

   if(!pool.length){if(it.r==='prot'){ok=false;break}continue}

function loadLogo(file){

  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S.brand.logo=cv.toDataURL('image/png');save();render();toast('Logo guardado')};img.onerror=()=>toast('No se pudo leer la imagen: usa PNG o JPG');img.src=rd.result};rd.readAsDataURL(file);

function chartSVG(pts,label,unit,good){
 if(pts.length<1)return'';
 const W=300,H=120,pad=26,vs=pts.map(p=>p[1]),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
 const x=i=>pad+(pts.length===1?(W-2*pad)/2:i*(W-2*pad)/(pts.length-1)),y=v=>H-pad+6-((v-mn)/rg)*(H-2*pad);
 const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ');
 const diff=vs[vs.length-1]-vs[0];
 const col=!diff?'var(--muted)':((diff<0)===(good==='down'))?'var(--ok)':'var(--bad)';
 return`<div class="chart"><div class="barl"><b>${label}</b><span style="color:${col};font-weight:600">${diff>0?'+':''}${fmt(diff,1)} ${unit}</span></div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}"><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${p[0]}: ${fmt(p[1],1)} ${unit}</title></circle>`).join('')}
 <text x="${pad}" y="${H-4}" font-size="10" fill="var(--muted)">${pts[0][0]}</text><text x="${W-pad}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="end">${pts[pts.length-1][0]}</text>
 <text x="2" y="${y(mx)+4}" font-size="10" fill="var(--muted)">${fmt(mx,1)}</text><text x="2" y="${y(mn)+4}" font-size="10" fill="var(--muted)">${fmt(mn,1)}</text></svg></div>`;
}
function viewProgreso(c){
 const h=[...c.historial].sort((a,b)=>a.fecha.localeCompare(b.fecha));
 if(!h.length)return`<div class="card"><h2>Progreso</h2><p class="muted">Todavía no hay mediciones. En la ficha, rellena la composición corporal y pulsa "Guardar medición en el historial". Lo ideal es medir cada 4 semanas, a la misma hora y en las mismas condiciones.</p></div>`;
 const ser=(k)=>h.filter(x=>parseFloat(x[k])>0).map(x=>[x.fecha.slice(5).split('-').reverse().join('/'),parseFloat(x[k])]);
 const good=c.objetivo==='volumen'||c.objetivo==='fuerza'?'up':'down';
 return`<div class="card"><h2>Evolución</h2><p class="sub">Verde = cambio en la dirección del objetivo.</p><div class="charts">
 ${chartSVG(ser('peso'),'Peso','kg',good)}${chartSVG(ser('grasa'),'Grasa corporal','%','down')}${chartSVG(ser('musculo'),'Masa muscular','kg','up')}${chartSVG(ser('agua'),'Agua corporal','%','up')}${chartSVG(ser('cintura'),'Cintura','cm','down')}${chartSVG(ser('visceral'),'Grasa visceral','','down')}</div></div>
 <div class="card"><h2>Historial de mediciones</h2><div class="tscroll"><table class="t"><tr><th>Fecha</th><th>Peso</th><th>% grasa</th><th>Músculo</th><th>% agua</th><th>Visceral</th><th>Cintura</th><th></th></tr>
 ${h.slice().reverse().map(x=>`<tr><td>${x.fecha.split('-').reverse().join('/')}</td><td>${x.peso||'—'}</td><td>${x.grasa||'—'}</td><td>${x.musculo||'—'}</td><td>${x.agua||'—'}</td><td>${x.visceral||'—'}</td><td>${x.cintura||'—'}</td><td class="noprint"><button class="swap" data-delh="${x.fecha}">Borrar</button></td></tr>`).join('')}</table></div></div>`;
}

/* ================= EVENTOS ================= */
function update(field,val){const c=cur();if(!c)return;c[field]=val;save()}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.b){S.brand[t.dataset.b]=t.value;save();if(t.dataset.b==='nombre'||t.dataset.b==='negocio')renderSide();return}
 if(t.id==='q'){S.q=t.value;renderSide();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);return}
 if(!t.dataset.f||t.tagName==='SELECT')return;
 update(t.dataset.f,t.type==='number'?(t.value===''?'':+t.value):t.value);
 const c=cur();
 if(t.dataset.f==='nombre'){$('#ttl').textContent=c.nombre;renderSide()}
 if(t.dataset.f==='edad')renderSide();
 const live=$('#live');if(live)live.innerHTML=statsHTML(analysis(c,metrics(c)));
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='logoFile'){if(t.files[0])loadLogo(t.files[0]);t.value='';return}
 if(t.id==='importFile'){const file=t.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.clients))throw 0;
  const ids=new Set(S.clients.map(c=>c.id));let n=0;d.clients.forEach(c=>{if(c&&c.id&&!ids.has(c.id)){S.clients.push({...newClient(c.sexo==='H'?'H':'M'),...c});n++}});if(d.brand&&!Object.keys(S.brand||{}).length)S.brand=d.brand;save();render();toast(n+' clientes importados')}catch(err){toast('Archivo no válido')}t.value=''};rd.readAsText(file);return}
 if(t.tagName==='SELECT'&&t.dataset.f){const v=t.value;update(t.dataset.f,v!==''&&!isNaN(+v)&&t.dataset.f==='minutos'?+v:v);render()}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const c=cur(),d=b.dataset;
 if(d.sel){S.active=d.sel;S.view='cliente';save();render();window.scrollTo(0,0);return}
 if(d.filter){S.filter=d.filter;renderSide();return}
 if(d.tab){S.tab=d.tab;renderMain();window.scrollTo(0,0);return}
 if(d.day){S.dietDay=+d.day;renderMain();return}
 if(d.set&&c){let v=d.v;if(['dias','comidas','trimestre'].includes(d.set))v=+v;c[d.set]=v;save();
  if(d.set==='sexo'){if(c.sexo==='H'&&c.enfoque==='gluteos')c.enfoque='equilibrado';render();return}
  b.parentElement.querySelectorAll('[data-set]').forEach(x=>x.classList.toggle('on',x===b));
  if(d.set==='objetivo'){renderSide();$('.top .badge:last-of-type').textContent=OBJ_N[v]}
  return}
 if(d.tog&&c){const arr=c[d.tog]=c[d.tog]||[];const i=arr.indexOf(d.v);if(i>=0)arr.splice(i,1);else arr.push(d.v);save();
  if(d.v==='embarazo'){render();return}
  b.classList.toggle('on',i<0);
  const det=b.closest('details');if(det){const s=det.querySelector('summary .muted');if(s)s.textContent=`(${det.querySelectorAll('.chip.on').length} quitados)`}
  return}
 if(d.swap&&c){c.swaps=c.swaps||{};c.swaps[d.swap]=(c.swaps[d.swap]||0)+1;save();const y=window.scrollY;renderMain();window.scrollTo(0,y);return}
 if(d.delh&&c){if(confirm('¿Borrar la medición del '+d.delh+'?')){c.historial=c.historial.filter(x=>x.fecha!==d.delh);save();renderMain()}return}
 switch(d.act){
  case'new':{const n=newClient(d.v);S.clients.push(n);S.active=n.id;S.tab='ficha';S.view='cliente';save();render();window.scrollTo(0,0);setTimeout(()=>{const i=document.querySelector('[data-f=nombre]');if(i){i.focus();i.select()}},30);break}
  case'del':if(c&&confirm('¿Eliminar a '+c.nombre+' y todos sus datos?')){S.clients=S.clients.filter(x=>x!==c);S.active=S.clients[0]?.id||null;save();render()}break;
  case'savemed':{if(!c)break;const f=c.fechaMed||today();const rec={fecha:f,peso:c.peso,grasa:c.grasa,musculo:c.musculo,agua:c.agua,visceral:c.visceral,cintura:c.cintura};
   c.historial=c.historial.filter(x=>x.fecha!==f);c.historial.push(rec);save();renderMain();toast('Medición guardada');break}
  case'regen':if(c){c.seed=(+c.seed||1)+1;save();renderMain()}break;
  case'resetswaps':if(c){c.swaps={};save();renderMain()}break;
  case'print':window.print();break;
  case'export':{const blob=new Blob([JSON.stringify({app:'CoachFit Pro',fecha:today(),brand:S.brand,clients:S.clients},null,1)],{type:'application/json'});
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='coachfit-copia-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}
  case'import':document.getElementById('importFile').click();break;
  case'marca':S.view='marca';render();window.scrollTo(0,0);break;
  case'volver':S.view='cliente';render();toast('Marca guardada');break;
  case'logo':document.getElementById('logoFile').click();break;
  case'nologo':delete S.brand.logo;save();render();break;
  case'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;renderSide()})}break;
 }
});
load();
if(S.active&&!cur())S.active=S.clients[0]?.id||null;
render();
</script>
</body>
</html>
